<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Moses — The Burning Bush</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#04050d;overflow:hidden;overscroll-behavior:none}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.full{position:absolute;inset:0;width:100%;height:100%;display:block}
.sky{opacity:0;transition:opacity 5s ease-in-out}
#skyDusk{background:linear-gradient(#2a2748 0%,#6a557c 44%,#e8b98a 72%,#e8b98a 100%)}
#skyNight{background:linear-gradient(#060a1e 0%,#14224a 58%,#264264 76%,#264264 100%)}
#skyDawn{background:linear-gradient(#3c4c72 0%,#b79aa0 46%,#f6dcae 72%,#f6dcae 100%)}
#stage[data-t=dusk] #skyDusk,#stage[data-t=night] #skyNight,#stage[data-t=dawn] #skyDawn{opacity:1}
#stars{opacity:0;transition:opacity 6s}
#stage[data-t=night] #stars{opacity:1}
#stars i{position:absolute;border-radius:50%;background:#dfe6ff}
#stars i.tw{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}

#stage[data-t=dusk]{--far:#c9977a;--mount:#9c6a62;--mid:#7a4c4c;--ground:#553438;--fore1:#3b2430;--fore2:#261724;--fig:#1c1118;--wool:#c9b292}
#stage[data-t=night]{--far:#26335a;--mount:#1c2748;--mid:#161d3a;--ground:#11162c;--fore1:#0a0e20;--fore2:#060816;--fig:#04050d;--wool:#6c7594}
#stage[data-t=dawn]{--far:#d3ab92;--mount:#a98274;--mid:#84605a;--ground:#5e4244;--fore1:#3d2a30;--fore2:#291b22;--fig:#1e1318;--wool:#d8c5a4}
.c-far{fill:var(--far)}.c-mount{fill:var(--mount)}.c-mid{fill:var(--mid)}.c-ground{fill:var(--ground)}
.c-fore1{fill:var(--fore1)}.c-fore2{fill:var(--fore2)}.c-fig{fill:var(--fig)}.c-wool{fill:var(--wool)}
.s-fig{stroke:var(--fig);fill:none}
.c-far,.c-mount,.c-mid,.c-ground,.c-fore1,.c-fore2,.c-fig,.c-wool,.ink,.s-fig{transition:fill 5s ease-in-out,stroke 5s ease-in-out}
.ink{fill:var(--fig);stroke:var(--fig)}
.rim{fill:#f09a3e;stroke:#f09a3e}
.hit{fill:transparent;stroke:none;pointer-events:none}
.hit.live{pointer-events:all;cursor:pointer}
.ring{fill:none;stroke:#fff3c4;stroke-width:2.5;vector-effect:non-scaling-stroke;opacity:0;transform-box:fill-box;transform-origin:center;pointer-events:none}
.ring.on{animation:ring 2.2s ease-out infinite}
@keyframes ring{0%{opacity:0;transform:scale(.45)}25%{opacity:.8}100%{opacity:0;transform:scale(1.5)}}
#snake{transition:stroke .7s}
.rip{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:2px solid rgba(255,243,196,.55);pointer-events:none;animation:rip .55s ease-out forwards}
@keyframes rip{from{transform:scale(.2);opacity:1}to{transform:scale(1.25);opacity:0}}
#black{background:#04050d;pointer-events:none}
#flash{background:#fff3c4;opacity:0;pointer-events:none}
button{position:absolute;width:48px;height:48px;padding:10px;border:0;border-radius:50%;background:rgba(10,12,28,.28);color:#fff3c4;cursor:pointer;-webkit-tap-highlight-color:transparent}
button svg{width:100%;height:100%;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#mute{top:12px;right:12px;opacity:.55}
#mute.off .on,#mute:not(.off) .x{display:none}
#again{left:50%;bottom:9%;margin-left:-30px;width:60px;height:60px;padding:14px;opacity:0;transition:opacity 2s;pointer-events:none}
#again.show{opacity:.85;pointer-events:auto}
#start{display:flex;align-items:center;justify-content:center;background:#04050d;cursor:pointer;transition:opacity 1.6s}
#start svg{width:120px;height:120px;animation:ember 2.4s ease-in-out infinite;overflow:visible}
@keyframes ember{50%{transform:scale(1.14);filter:brightness(1.25)}}
</style>
</head>
<body>
<div id="stage" data-t="dusk">
  <div id="skyDusk" class="sky full"></div>
  <div id="skyNight" class="sky full"></div>
  <div id="skyDawn" class="sky full"></div>
  <div id="stars" class="full"></div>

  <svg id="world" class="full" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <radialGradient id="gGlow"><stop offset="0" stop-color="#fff3c4" stop-opacity=".95"/><stop offset=".22" stop-color="#f8b83a" stop-opacity=".55"/><stop offset=".6" stop-color="#ef7a1a" stop-opacity=".16"/><stop offset="1" stop-color="#ef7a1a" stop-opacity="0"/></radialGradient>
      <radialGradient id="gHolyW"><stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset=".4" stop-color="#fff3c4" stop-opacity=".55"/><stop offset="1" stop-color="#f8d27a" stop-opacity="0"/></radialGradient>
      <radialGradient id="gCloudR"><stop offset="0" stop-color="#d23a1e" stop-opacity=".8"/><stop offset=".55" stop-color="#c8321e" stop-opacity=".4"/><stop offset="1" stop-color="#c8321e" stop-opacity="0"/></radialGradient>
      <radialGradient id="gCloudO"><stop offset="0" stop-color="#f58a1f" stop-opacity=".9"/><stop offset=".55" stop-color="#ef7a1a" stop-opacity=".45"/><stop offset="1" stop-color="#ef7a1a" stop-opacity="0"/></radialGradient>
      <radialGradient id="gCloudY"><stop offset="0" stop-color="#ffe08a" stop-opacity=".95"/><stop offset=".55" stop-color="#f8c95a" stop-opacity=".5"/><stop offset="1" stop-color="#f8c95a" stop-opacity="0"/></radialGradient>
      <radialGradient id="gCloudW"><stop offset="0" stop-color="#fffdf2"/><stop offset=".4" stop-color="#fff3c4" stop-opacity=".8"/><stop offset="1" stop-color="#fff3c4" stop-opacity="0"/></radialGradient>
      <linearGradient id="gPath" x1="1" x2="0"><stop offset="0" stop-color="#fff3c4"/><stop offset=".5" stop-color="#f8d27a"/><stop offset="1" stop-color="#f8d27a" stop-opacity=".25"/></linearGradient>
      <path id="flame" d="M0,8 L-9,4 L-11,-7 L-5,-21 L-2,-13 L1,-30 L8,-15 L11,-3 L8,5Z"/>
      <g id="mosesDef">
        <path id="rLegs" fill="none" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
        <ellipse id="rFootB" rx="8" ry="3.5"/><ellipse id="rFootF" rx="8" ry="3.5"/>
        <path id="rArmB" fill="none" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="rRobe"/>
        <g id="rHead"><circle r="10.5"/><path d="M-11,-3 C-10,-15 7,-16 10,-5 C4,-8 -3,-7 -7,0 C-9,4 -12,6 -14,9 C-15,3 -14,-1 -11,-3Z"/><path id="rTail" d="M-11,-3 C-9,-3 -6,-1 -7,0 C-11,8 -17,13 -21,23 C-22,11 -16,2 -11,-3Z"/><path d="M4,6 C11,6 13,13 8,22 C4,18 2,12 4,6Z"/></g>
        <g id="rStaff"><path d="M2.5,64 L-1.5,-44 C-1.5,-56 10.5,-55 9.5,-45" stroke-width="3.6" fill="none" stroke-linecap="round"/></g>
        <path id="rArmF" fill="none" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </defs>
    <g id="setA"></g>
    <g id="setB" display="none"></g>
  </svg>

  <!-- insert: the sandals -->
  <svg id="feet" class="full" preserveAspectRatio="none" style="display:none" aria-hidden="true">
    <defs><radialGradient id="gHoly"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset=".35" stop-color="#fff3c4" stop-opacity=".6"/><stop offset="1" stop-color="#f8d27a" stop-opacity="0"/></radialGradient></defs>
    <rect x="-3000" y="-3000" width="6000" height="6000" fill="#120a12"/>
    <polygon id="fGlow" points="330,-3000 3000,-3000 3000,3000 560,3000 440,200 500,-400" fill="#8a4a26"/>
    <path d="M-3000,3000 L-3000,18 L-420,8 L-300,-22 L-180,14 L40,22 L260,-6 L420,16 L3000,6 L3000,3000Z" fill="#1b1326"/>
    <rect x="-3000" y="60" width="6000" height="3000" fill="#150d14"/>
    <rect x="-3000" y="60" width="6000" height="4" fill="#e8a25a" opacity=".3"/>
    <g id="holy" opacity="0"><polygon points="-520,66 -220,34 200,30 520,60 260,104 -240,108" fill="#fff3c4" opacity=".45"/><polygon points="-300,66 -120,48 140,46 300,64 150,86 -130,88" fill="#ffffff" opacity=".6"/></g>
    <rect id="holyLine" x="-3000" y="59" width="6000" height="3" fill="#fff3c4" opacity="0"/>
    <g id="footFar" transform="translate(-75,54) scale(.88)">
      <g class="leg"><path d="M-27,-240 L-31,-22 L-27,-4 L-11,0 L61,0 L74,-4 L73,-13 L47,-21 L26,-30 L17,-42 L15,-240Z" fill="#e8a25a"/><path d="M-30,-240 L-34,-22 L-30,-4 L-14,0 L58,0 L71,-4 L70,-13 L44,-21 L23,-30 L14,-42 L12,-240Z" fill="#6e4530"/></g>
      <g class="sandal"><path d="M-40,0 L74,0 C80,0 80,9 74,9 L-40,9 C-46,9 -46,0 -40,0Z" fill="#33200f"/><path d="M26,1 L33,-25 M51,1 L45,-19 M-34,-31 L14,-35 M-31,1 L-33,-30 M13,-35 L30,-2" stroke="#b08d5c" stroke-width="6" stroke-linecap="round" fill="none"/></g>
      <circle class="ring" cx="16" cy="-12" r="52"/><rect class="hit" x="-70" y="-90" width="170" height="130"/>
    </g>
    <g id="footNear" transform="translate(40,62)">
      <g class="leg"><path d="M-27,-240 L-31,-22 L-27,-4 L-11,0 L61,0 L74,-4 L73,-13 L47,-21 L26,-30 L17,-42 L15,-240Z" fill="#f0aa5e"/><path d="M-30,-240 L-34,-22 L-30,-4 L-14,0 L58,0 L71,-4 L70,-13 L44,-21 L23,-30 L14,-42 L12,-240Z" fill="#9a6240"/></g>
      <g class="sandal"><path d="M-40,0 L74,0 C80,0 80,9 74,9 L-40,9 C-46,9 -46,0 -40,0Z" fill="#3b2416"/><path d="M26,1 L33,-25 M51,1 L45,-19 M-34,-31 L14,-35 M-31,1 L-33,-30 M13,-35 L30,-2" stroke="#c7a06a" stroke-width="6" stroke-linecap="round" fill="none"/></g>
      <circle class="ring" cx="16" cy="-12" r="56"/><rect class="hit" x="-60" y="-90" width="170" height="140"/>
    </g>
    <path d="M-197,-900 L-227,-200 L-212,-82 L-117,-98 L-57,-74 L53,-96 L113,-70 L203,-90 L238,-76 L228,-500 L218,-900Z" fill="#c06a36" opacity=".55" transform="translate(4,2)"/>
    <path d="M-200,-900 L-230,-200 L-215,-84 L-120,-100 L-60,-76 L50,-98 L110,-72 L200,-92 L235,-78 L225,-500 L215,-900Z" fill="#0d0912"/>
  </svg>

  <!-- insert: the vision in the fire -->
  <svg id="vision" class="full" preserveAspectRatio="none" style="display:none" aria-hidden="true">
    <defs><radialGradient id="gVision" gradientUnits="userSpaceOnUse" cx="0" cy="-10" r="540"><stop offset="0" stop-color="#fff0b8"/><stop offset=".18" stop-color="#f8c04a"/><stop offset=".42" stop-color="#ef7a1a"/><stop offset=".7" stop-color="#c8321e"/><stop offset="1" stop-color="#4a0d10"/></radialGradient></defs>
    <rect x="-3000" y="-3000" width="6000" height="6000" fill="#4a0d10"/><polygon points="-520,-60 -380,-400 -60,-540 300,-470 520,-200 560,160 380,470 20,560 -330,480 -540,220" fill="#a3261a"/><polygon points="-380,-40 -280,-290 -30,-390 220,-340 380,-140 400,110 270,330 10,400 -240,340 -390,150" fill="#c8321e"/><polygon points="-240,-30 -170,-190 -20,-250 140,-210 240,-90 250,70 170,200 0,240 -150,200 -240,90" fill="#ef7a1a"/><polygon points="-110,-20 -80,-100 -10,-130 70,-110 110,-50 120,30 80,90 0,110 -70,90 -110,40" fill="#f8c04a"/>
    <polygon points="-340,110 -195,-95 -50,110" fill="#b5361f" opacity=".55"/>
    <polygon points="-170,110 -62,-34 46,110" fill="#9c2a18" opacity=".7"/>
    <g id="vFlames"></g>
    <rect x="-3000" y="110" width="6000" height="3000" fill="#3a0c10"/>
    <g fill="#24060a" stroke="#24060a" stroke-linecap="round">
      <g id="vBlock"><rect x="-196" y="58" width="58" height="46" stroke="none"/><circle cx="-184" cy="106" r="5" stroke="none"/><circle cx="-150" cy="106" r="5" stroke="none"/><path id="vRope" d="M-138,80 L-74,64 L-24,64 L26,64" stroke-width="2.2" fill="none"/></g>
      <g id="vHaul"></g>
      <g transform="translate(118,110)">
        <path d="M0,-28 L0,-64" stroke-width="14"/><path d="M0,-28 L-7,0 M0,-28 L8,0" stroke-width="7"/>
        <circle cx="-1" cy="-76" r="8" stroke="none"/><path d="M-7,-85 L9,-86 L15,-58 L5,-66Z" stroke="none"/>
        <g id="vWhip"><path d="M0,-60 L-10,-86" stroke-width="6"/><path d="M-10,-86 C-12,-126 -66,-124 -88,-74" stroke-width="2.4" fill="none"/></g>
      </g>
    </g>
  </svg>

  <!-- insert: the hand (flat polygons) -->
  <svg id="hand" class="full" preserveAspectRatio="none" style="display:none" aria-hidden="true">
    <rect x="-3000" y="-3000" width="6000" height="6000" fill="#1a1220"/>
    <polygon points="120,-3000 3000,-3000 3000,3000 420,3000 300,300 380,-200" fill="#231626"/>
    <polygon id="hLight" points="520,-3000 3000,-3000 3000,3000 760,3000 640,200 700,-400" fill="#8a4a26"/>
    <g id="hArm">
      <polygon points="150,-62 900,-150 900,170 150,64" fill="#0d0912"/>
      <polygon points="150,-62 900,-150 900,-96 168,-34" fill="#5a3320"/>
      <polygon points="60,-28 170,-40 170,40 60,30" style="fill:var(--hb)"/>
      <polygon points="60,-28 170,-40 170,-14 60,-8" style="fill:var(--hl)"/>
      <g id="hPalm">
        <polygon points="60,-30 -10,-36 -30,-10 -28,22 0,34 60,30" style="fill:var(--hb)"/>
        <polygon points="60,-30 -10,-36 -16,-18 60,-8" style="fill:var(--hl)"/>
        <polygon points="60,30 0,34 -28,22 -20,14 60,16" style="fill:var(--hs)"/>
        <polygon points="26,-32 0,-66 -20,-60 -10,-36" style="fill:var(--hl)"/>
        <g id="hFing">
          <polygon points="-10,-36 -82,-36 -86,-23 -30,-18" style="fill:var(--hl)"/>
          <polygon points="-30,-18 -94,-17 -97,-3 -30,-2" style="fill:var(--hb)"/>
          <polygon points="-30,-2 -88,1 -90,14 -29,12" style="fill:var(--hb)"/>
          <polygon points="-29,12 -72,19 -72,31 -22,26" style="fill:var(--hs)"/>
        </g>
      </g>
    </g>
    <polygon points="-3000,-3000 70,-3000 10,-520 -20,-200 -64,0 -34,230 -70,560 -110,3000 -3000,3000" fill="#0d0912"/>
    <polygon points="70,-3000 10,-520 -20,-200 -64,0 -34,230 -70,560 -110,3000 -140,3000 -96,560 -62,230 -92,0 -50,-200 -22,-520 36,-3000" fill="#5a3320"/>

  <svg id="face" class="full" preserveAspectRatio="none" style="display:none" aria-hidden="true">
    <rect x="-3000" y="-3000" width="6000" height="6000" fill="#0b1030"/>
    <polygon id="fcLight" points="260,-3000 3000,-3000 3000,3000 420,3000 330,300 400,-300" fill="#8a4a26"/>
    <polygon points="-3000,-3000 90,-3000 62,-300 40,-150 20,-150 10,-40 20,60 70,70 60,150 24,270 -40,460 -60,3000 -3000,3000" fill="#0d0912"/>
    <polygon points="20,-150 40,-150 70,-70 80,-50 120,0 86,14 92,34 80,50 70,70 20,60 10,-40" fill="#b8683a"/>
    <polygon points="30,-150 40,-150 70,-70 80,-50 120,0 100,-4 66,-48 52,-80" fill="#e8a25a"/>
    <polygon points="90,-3000 62,-300 40,-150 26,-150 46,-300 70,-3000" fill="#5a3320"/>
    <polygon points="70,70 78,74 68,152 60,150" fill="#5a3320"/>
    <g id="fcEye"><polygon points="30,-64 52,-70 64,-58 50,-50 32,-52" fill="#f3e6c8"/><polygon points="48,-66 58,-62 56,-53 46,-54" fill="#0d0912"/></g>
    <polygon points="24,-74 60,-84 70,-70 28,-66" fill="#0d0912"/>

  <div id="flash" class="full"></div>
  <div id="black" class="full"></div>

  <button id="mute" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path class="on" d="M15.5 9.5a4 4 0 0 1 0 5M18 7a7.5 7.5 0 0 1 0 10"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
  <button id="again" aria-label="Again"><svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5"/><path d="M4 4.5v4h4"/></svg></button>

  <div id="start" class="full" role="button" aria-label="Begin">
    <svg viewBox="-30 -50 60 70"><use href="#flame" fill="#c8321e" transform="scale(1.7)"/><use href="#flame" fill="#ef7a1a" transform="translate(0,3) scale(-1.2,1.2)"/><use href="#flame" fill="#fff3c4" transform="translate(0,6) scale(.65)"/></svg>
  </div>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s), NS='http://www.w3.org/2000/svg';
const el=(tag,a={},parent)=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(parent)parent.appendChild(e);return e};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const io=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2, lin=u=>u, out=u=>1-Math.pow(1-u,3), inn=u=>u*u*u;
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const stage=$('#stage'), world=$('#world'), feet=$('#feet'), vision=$('#vision');
const RA=600, RB=5600, BX=5800, BY=600;

/* ---------- build the paper world ---------- */
const LAYERS=[];
const layer=(set,d,ref)=>{const g=el('g',{},$('#set'+set));LAYERS.push({g,d,ref});return g};
const card=(g,d,cls)=>el('path',{d,class:cls},g);
function ridge(x0,x1,base,amp,wl,seed,step=150){const r=rng(seed),p=[r()*6,r()*6,r()*6];let d=`M${x0},3000`;
  for(let x=x0;x<=x1;x+=step){const y=base-amp*(Math.sin(x/wl+p[0])*.6+Math.sin(x/(wl*.37)+p[1])*.3+Math.sin(x/(wl*.13)+p[2])*.1);d+=`L${x},${y.toFixed(1)}`}
  return d+`L${x1},3000Z`}
const poly=(ref,pts)=>'M'+pts.map(p=>(ref+p[0])+','+p[1]).join('L')+'Z';
function tufts(g,x0,x1,y,n,seed,cls){const r=rng(seed);for(let i=0;i<n;i++){const x=x0+r()*(x1-x0),h=10+r()*14,yy=y+r()*6;
  el('path',{d:`M${x-7},${yy} L${x-9},${yy-h*.7} L${x-3},${yy-2} L${x},${yy-h} L${x+3},${yy-2} L${x+10},${yy-h*.6} L${x+7},${yy}Z`,class:cls},g)}}
function sheepEl(g,kind){const s=el('g',{},g),goat=kind==='goat',hy=goat?-14:-12,px=goat?13:15,py=-23;
  const legs=[-15,-9,9,14].map(x=>el('line',{x1:x,y1:hy,x2:x,y2:0,class:'s-fig','stroke-width':2.4,'stroke-linecap':'round'},s));
  const head=el('g',{},s);
  if(goat){
    el('path',{d:'M-20,-19 C-21,-27 -14,-30 -6,-29 L10,-29 C17,-29 20,-25 19,-19 C18,-14 13,-13 6,-13 L-12,-13 C-17,-13 -19,-15 -20,-19Z M-19,-27 L-26,-34 L-20,-23Z',class:'c-fig'},s);
    el('path',{d:'M11,-28 C15,-35 18,-41 23,-44 L33,-39 C34,-36 31,-34 27,-34 C24,-29 21,-23 15,-19Z',class:'c-fig'},head);
    el('path',{d:'M29,-35 L28,-27 L25,-34Z',class:'c-fig'},head);
    el('path',{d:'M23,-44 C21,-52 15,-55 11,-51',class:'s-fig','stroke-width':2.2,'stroke-linecap':'round'},head);
  }else{
    el('path',{d:'M-22,-17 C-24,-27 -16,-32 -6,-31 L10,-31 C18,-31 22,-26 21,-19 C20,-13 14,-11 6,-11 L-12,-11 C-18,-11 -21,-13 -22,-17Z M-21,-26 C-29,-25 -30,-12 -25,-7 C-21,-10 -20,-17 -21,-26Z',class:'c-fig'},s);
    el('path',{d:'M13,-28 C17,-34 21,-39 26,-40 C31,-41 36,-36 35,-32 C34,-29 30,-28 27,-29 C24,-25 21,-21 16,-18Z',class:'c-fig'},head);
    el('path',{d:'M24,-39 C20,-37 18,-30 20,-25 C24,-28 26,-34 24,-39Z',class:'c-fig'},head);
  }
  s.appendChild(head);
  el('rect',{x:-36,y:-60,width:76,height:68,class:'hit live'},s);
  return{g:s,legs,head,hy,px,py}}

function blob(g,cx,cy,rx,ry,fill,steps,seed){const r=rng(seed),grp=el('g',{},g);
  for(const [sc,op] of steps){const pts=[],n=11;for(let i=0;i<n;i++){const a=i/n*6.283+r()*.25,rr=sc*(.86+r()*.28);pts.push((cx+Math.cos(a)*rx*rr).toFixed(1)+','+(cy+Math.sin(a)*ry*rr).toFixed(1))}
    el('polygon',{points:pts.join(' '),fill,opacity:op},grp)}return grp}
// Set A — the plain at dusk
