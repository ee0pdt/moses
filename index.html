<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#04050d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="An animated, interactive film about the life of Moses.">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Moses</title>
</head>
<body>
  <div id="stage" data-t="dusk">
    <div id="scene"></div>
    <div id="flash" class="full"></div>
    <div id="black" class="full"></div>

    <nav id="menu" class="full" aria-label="Chapters"><ol class="cards"></ol></nav>

    <button id="menuBtn" aria-label="Chapters"><svg viewBox="0 0 24 24"><path d="M5 5h5v5H5zM14 5h5v5h-5zM5 14h5v5H5zM14 14h5v5h-5z"/></svg></button>
    <button id="mute" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path class="on" d="M15.5 9.5a4 4 0 0 1 0 5M18 7a7.5 7.5 0 0 1 0 10"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
    <button id="again" aria-label="Again"><svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5"/><path d="M4 4.5v4h4"/></svg></button>

    <div id="start" class="full" role="button" aria-label="Begin">
      <svg viewBox="-30 -50 60 70">
        <path d="M0,8 L-9,4 L-11,-7 L-5,-21 L-2,-13 L1,-30 L8,-15 L11,-3 L8,5Z" fill="#c8321e" transform="scale(1.7)"/>
        <path d="M0,8 L-9,4 L-11,-7 L-5,-21 L-2,-13 L1,-30 L8,-15 L11,-3 L8,5Z" fill="#ef7a1a" transform="translate(0,3) scale(-1.2,1.2)"/>
        <path d="M0,8 L-9,4 L-11,-7 L-5,-21 L-2,-13 L1,-30 L8,-15 L11,-3 L8,5Z" fill="#fff3c4" transform="translate(0,6) scale(.65)"/>
      </svg>
    </div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
